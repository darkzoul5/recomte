name: Run Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".env.example"
      - "plans/**"
      - ".gitignore"
      - "LICENSE"
      - ".github/workflows/node-deps.yml"
  pull_request:

concurrency:
  group: campersite-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      # Start admin server
      - name: Start admin server
        env:
          NODE_ENV: production
          ADMIN_USERNAME: test
          ADMIN_PASSWORD: testtesttest
          SESSION_SECRET: testqwertyuiopasdfghjklzxcvbnm123456test
        run: |
          node src/server/index.js &
      
      # Wait until server is reachable 
      - name: Wait for server
        run: |
          for i in {1..10}; do
            if curl -s http://127.0.0.1:3000 >/dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run admin smoketest
        env:
          TEST_PATH: /admin/login
          TEST_PORT: 3001
        run: node tests/smoke-http.js

      - name: Run public smoketest
        env:
          TEST_PATH: /
        run: node tests/smoke-http.js

      - name: Run robots.txt smoketest
        env:
          TEST_PATH: /robots.txt
        run: node tests/smoke-http.js
    
      - name: Run sitemap smoketest
        env:
          TEST_PATH: /sitemap.xml
        run: node tests/smoke-http.js
      
      - name: Run /contacts smoketest
        env:
          TEST_PATH: /contacts
        run: node tests/smoke-http.js