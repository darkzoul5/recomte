name: Run Tests

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths-ignore:
      - ".github/workflows/test.yml"
      - ".github/workflows/lint.yml"
      - "docs/**"
      - "plans/**"
      - "README.md"
      - "LICENSE"
      - ".env.example"
      - ".gitignore"
      - ".dockerignore"
      - "renovate.json"
      - ".github/workflows/release-build.yml"
      - "cliff.toml"

concurrency:
  group: campersite-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: local-ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SQL injection tests
        run: node --experimental-strip-types tests/test-sql-injection.js

      - name: Run XSS protection tests
        run: node --experimental-strip-types tests/test-xss-protection.js

      - name: Run database migration tests
        run: node --experimental-strip-types tests/test-db-migrations.js

      # Start server
      - name: Start server
        env:
          NODE_ENV: production
          ADMIN_USERNAME: test
          ADMIN_PASSWORD: testtesttest
          SESSION_SECRET: testqwertyuiopasdfghjklzxcvbnm123456test
          SESSION_COOKIE_SECURE: false
        run: |
          node --experimental-strip-types src/server/index.js &

      # Wait until server is reachable
      - name: Wait for server
        run: |
          for i in {1..10}; do
            if curl -s http://127.0.0.1:3000 >/dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run admin smoketest
        env:
          TEST_PATH: /admin/login
          TEST_PORT: 3001
        run: node --experimental-strip-types tests/smoke-http.js

      - name: Run public smoketest
        env:
          TEST_PATH: /
        run: node --experimental-strip-types tests/smoke-http.js

      - name: Run robots.txt smoketest
        env:
          TEST_PATH: /robots.txt
        run: node --experimental-strip-types tests/smoke-http.js

      - name: Run sitemap smoketest
        env:
          TEST_PATH: /sitemap.xml
        run: node --experimental-strip-types tests/smoke-http.js

      - name: Run /contact smoketest
        env:
          TEST_PATH: /contact
        run: node --experimental-strip-types tests/smoke-http.js

      - name: Run /caravans smoketest
        env:
          TEST_PATH: /caravans
        run: node --experimental-strip-types tests/smoke-http.js

      - name: Run CSRF protection tests
        run: node --experimental-strip-types tests/test-csrf-protection.js

      - name: Run authentication protection tests
        run: node --experimental-strip-types tests/test-auth-protection.js
