name: Security Scan

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: campersite-security-${{ github.ref }}
  cancel-in-progress: true


jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Semgrep venv
        uses: actions/cache@v4
        with:
          path: ~/.cache/semgrep-venv
          key: semgrep-${{ runner.os }}

      - name: Install Semgrep
        run: |
          if [ ! -x "$HOME/.cache/semgrep-venv/bin/semgrep" ]; then
            python3 -m venv "$HOME/.cache/semgrep-venv"
            "$HOME/.cache/semgrep-venv/bin/pip" install --upgrade pip
            "$HOME/.cache/semgrep-venv/bin/pip" install semgrep
          fi

          echo "$HOME/.cache/semgrep-venv/bin" >> "$GITHUB_PATH"

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/nodejs \
            --config=p/typescript \
            --error

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Trivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/trivy
            ~/.local/bin/trivy
          key: trivy-${{ runner.os }}

      - name: Install Trivy
        run: |
          if [ ! -x "$HOME/.local/bin/trivy" ]; then
            mkdir -p "$HOME/.local/bin"

            curl -sfL \
              https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b "$HOME/.local/bin"
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Trivy
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            .