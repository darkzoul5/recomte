name: Security Scan

on:
  schedule:
    - cron: "0 3 * * 1" # 06:00 Riga time (UTC+3)

  workflow_dispatch:

concurrency:
  group: campersite-security-scan-${{ github.ref }}
  cancel-in-progress: true


jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Semgrep
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: semgrep-${{ runner.os }}

      - name: Install Semgrep
        run: |
          if ! command -v semgrep >/dev/null 2>&1; then
            python3 -m pip install --user semgrep
          fi

      - name: Run Semgrep
        run: |
          ~/.local/bin/semgrep scan \
            --config=p/security-audit \
            --config=p/nodejs \
            --config=p/typescript \
            --json \
            --output=semgrep.json

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json


  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Gitleaks
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: gitleaks-${{ runner.os }}

      - name: Install Gitleaks
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            mkdir -p ~/.local/bin

            curl -sSfL \
              https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz \
              -o /tmp/gitleaks.tar.gz

            tar -xzf /tmp/gitleaks.tar.gz \
              -C ~/.local/bin \
              gitleaks

            chmod +x ~/.local/bin/gitleaks
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks.json

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json


  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Trivy
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}

      - name: Install Trivy
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            curl -sfL \
              https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b ~/.local/bin
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Trivy
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --format json \
            --output trivy.json \
            .

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.json