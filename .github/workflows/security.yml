name: Security Scan

on:
  schedule:
    - cron: "0 3 * * 1" # 06:00 Riga time (UTC+3)

  workflow_dispatch:

concurrency:
  group: campersite-security-scan-${{ github.ref }}
  cancel-in-progress: true


jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Semgrep venv
        uses: actions/cache@v4
        with:
          path: ~/.cache/semgrep-venv
          key: semgrep-8.30.1-${{ runner.os }}

      - name: Install Semgrep
        run: |
          if [ ! -x "$HOME/.cache/semgrep-venv/bin/semgrep" ]; then
            python3 -m venv "$HOME/.cache/semgrep-venv"
            "$HOME/.cache/semgrep-venv/bin/pip" install --upgrade pip
            "$HOME/.cache/semgrep-venv/bin/pip" install semgrep
          fi

          echo "$HOME/.cache/semgrep-venv/bin" >> "$GITHUB_PATH"

      - name: Verify Semgrep
        run: |
          semgrep --version

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/nodejs \
            --config=p/typescript \
            --json \
            --output=semgrep.json

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json


  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Gitleaks
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: gitleaks-8.30.1-${{ runner.os }}

      - name: Install Gitleaks
        run: |
          VERSION=8.30.1

          if [ ! -x "$HOME/.local/bin/gitleaks" ]; then
            mkdir -p "$HOME/.local/bin"

            curl -sSfL \
              "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
              -o /tmp/gitleaks.tar.gz

            tar -xzf /tmp/gitleaks.tar.gz \
              -C "$HOME/.local/bin" \
              gitleaks

            chmod +x "$HOME/.local/bin/gitleaks"
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Gitleaks
        run: |
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks.json

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json


  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Trivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/trivy
            ~/.local/bin/trivy
          key: trivy-${{ runner.os }}

      - name: Install Trivy
        run: |
          if [ ! -x "$HOME/.local/bin/trivy" ]; then
            mkdir -p "$HOME/.local/bin"

            curl -sfL \
              https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b "$HOME/.local/bin"
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Trivy
        run: |
          trivy --version

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --format json \
            --output trivy.json \
            .

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.json