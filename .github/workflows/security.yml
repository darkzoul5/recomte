name: Security Scan

on:
  schedule:
    - cron: "0 3 * * 1"

  workflow_dispatch:

concurrency:
  group: campersite-security-scan-${{ github.ref }}
  cancel-in-progress: true


jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: docker://semgrep/semgrep:latest
        with:
          args: >
            scan
            --config=p/security-audit
            --config=p/nodejs
            --config=p/typescript
            --json
            --output=semgrep.json

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json


  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: >
            git
            --report-format=json
            --report-path=gitleaks.json
            .

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json


  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: docker://aquasec/trivy:latest
        with:
          args: >
            fs
            --scanners vuln,secret,misconfig
            --format json
            --output trivy.json
            .

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.json