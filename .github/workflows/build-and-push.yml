name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "app.js"
      - "package*.json"
      - "db/**"
      - "src/**"
      - "views/**"
      - "public/**"
      - "scripts/**"
      - ".dockerignore"
      - ".github/workflows/build-and-push.yml"

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for stable release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: git.darkzoul.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: git.darkzoul.org/dark_zoul/campersite
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=git.darkzoul.org/dark_zoul/campersite:buildcache
          cache-to: type=registry,ref=git.darkzoul.org/dark_zoul/campersite:buildcache,mode=max

      - name: Trigger deploy webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "WEBHOOK_SECRET is not configured"
            exit 1
          fi

          curl --fail --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            -X POST "https://admin.recomte.ru/deploy" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions","repository":"${{ github.repository }}","sha":"${{ github.sha }}"}'
