name: Build, Tag and Push Docker Image

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed
  #push:
    #branches:
      #- main
    #paths-ignore:
      #- "README.md"
      #- "docs/**"
      #- ".env.example"
      #- "plans/**"
      #- ".gitignore"
      #- "LICENSE"
      #- ".github/workflows/node-deps.yml"


concurrency:
  group: campersite-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      should_tag: ${{ steps.version.outputs.should_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 🧠 Decide whether to tag + generate version
      - name: Determine tag
        id: version
        run: |
          SHOULD_TAG=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_TAG=true
          else
            LAST_COMMIT=$(git log -1 --pretty=%s)
            if echo "$LAST_COMMIT" | grep -q "\[tag it\]"; then
              SHOULD_TAG=true
            fi
          fi

          echo "should_tag=$SHOULD_TAG" >> $GITHUB_OUTPUT

          if [ "$SHOULD_TAG" = "true" ]; then
            TAG="v$(date +'%Y.%m.%d-%H%M')"
            echo "version=$TAG" >> $GITHUB_OUTPUT
          else
            echo "version=" >> $GITHUB_OUTPUT
          fi

      # 🏷️ Create Git tag (only if needed)
      - name: Create Git tag
        if: steps.version.outputs.should_tag == 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}

          git config user.name "gitea-actions"
          git config user.email "actions@local"

          git tag $VERSION
          git push origin $VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: git.darkzoul.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 🐳 Docker metadata
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: git.darkzoul.org/dark_zoul/campersite
          tags: |
            type=raw,value=dev
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.should_tag }}
            type=raw,value=latest,enable=${{ steps.version.outputs.should_tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=git.darkzoul.org/dark_zoul/campersite:buildcache
          cache-to: type=registry,ref=git.darkzoul.org/dark_zoul/campersite:buildcache,mode=max

  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod +x /home/deploy/docker/campersite/deploy.sh
            bash /home/deploy/docker/campersite/deploy.sh