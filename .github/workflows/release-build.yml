name: Release - Build, Tag and Deploy

env:
  TZ: "Europe/Riga"
  
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (optional, auto-generated if empty)"
        required: false

concurrency:
  group: campersite-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-release:
    uses: ./.github/workflows/test.yml


  build-release:
    runs-on: ubuntu-latest
    needs: test-release

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="v$(date +'%Y.%m.%d-%H%M')"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git config user.name "gitea-actions"
          git config user.email "actions@local"

          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Generate version.json
        run: |
          cat <<EOF > version.json
          {
            "version": "${{ steps.version.outputs.version }}",
            "env": "prod"
          }
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: git.darkzoul.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: git.darkzoul.org/dark_zoul/recomte
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=git.darkzoul.org/dark_zoul/recomte:buildcache
          cache-to: type=registry,ref=git.darkzoul.org/dark_zoul/recomte:buildcache,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}


      - name: Install git-cliff
        run: |
          VERSION=2.13.1
          wget -q \
            https://github.com/orhun/git-cliff/releases/download/v${VERSION}/git-cliff-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
    
          tar -xf git-cliff-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          sudo mv git-cliff-*/git-cliff /usr/local/bin/
        
      - name: Generate release notes
        id: git-cliff
        run: |
          {
            echo 'content<<EOF'
            git-cliff --latest --strip header --config cliff.toml
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.git-cliff.outputs.content }}
          generate_release_notes: false

  deploy-release:
    runs-on: ubuntu-latest
    needs: build-release
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Trigger Webhook Deployment
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # Minimal payload - just needs to be signed
          PAYLOAD='{"trigger": "gitea-actions"}'
          
          # Calculate HMAC-SHA256 signature
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | cut -d' ' -f2)
          
          # Send webhook
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-Gitea-Signature: $SIGNATURE" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
          
          echo "✅ Deployment webhook triggered!"

      - name: Wait for Deployment to Complete
        run: |
          echo "⏳ Waiting for deployment to complete..."
          sleep 30
          
          # Check if app is healthy (adjust URL)
          for i in {1..20}; do
            if curl -s -f -o /dev/null "https://recomte.ru/healthcheck"; then
              echo "✅ App is healthy!"
              exit 0
            fi
            echo "⏳ Waiting for app... ($i/20)"
            sleep 3
          done
          
          echo "❌ App failed to become healthy"
          exit 1
