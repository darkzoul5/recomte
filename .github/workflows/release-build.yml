name: Release - Build, Tag and Deploy

env:
  TZ: "Europe/Riga"
  
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (optional, auto-generated if empty)"
        required: false

concurrency:
  group: campersite-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Start server
      - name: Start server
        env:
          NODE_ENV: production
          ADMIN_USERNAME: test
          ADMIN_PASSWORD: testtesttest
          SESSION_SECRET: testqwertyuiopasdfghjklzxcvbnm123456test
        run: |
          node src/server/index.js &
      
      # Wait until server is reachable 
      - name: Wait for server
        run: |
          for i in {1..10}; do
            if curl -s http://127.0.0.1:3000 >/dev/null && curl -s http://127.0.0.1:3001 >/dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run admin smoketest
        env:
          TEST_PATH: /admin/login
          TEST_PORT: 3001
        run: node tests/smoke-http.js

      - name: Run public smoketest
        env:
          TEST_PATH: /
        run: node tests/smoke-http.js

      - name: Run robots.txt smoketest
        env:
          TEST_PATH: /robots.txt
        run: node tests/smoke-http.js
    
      - name: Run sitemap smoketest
        env:
          TEST_PATH: /sitemap.xml
        run: node tests/smoke-http.js
      
      - name: Run /contact smoketest
        env:
          TEST_PATH: /contact
        run: node tests/smoke-http.js

      - name: Run /caravans smoketest
        env:
          TEST_PATH: /caravans
        run: node tests/smoke-http.js

  build-release:
    runs-on: ubuntu-latest
    needs: test-release

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="v$(date +'%Y.%m.%d-%H%M')"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git config user.name "gitea-actions"
          git config user.email "actions@local"

          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Generate version.json
        run: |
          cat <<EOF > version.json
          {
            "version": "${{ steps.version.outputs.version }}",
            "env": "prod"
          }
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: git.darkzoul.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: git.darkzoul.org/dark_zoul/recomte
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=git.darkzoul.org/dark_zoul/recomte:buildcache
          cache-to: type=registry,ref=git.darkzoul.org/dark_zoul/recomte:buildcache,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
      
      - name: Generate release notes
        id: release_notes
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | sed -n '2p')

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)")
          else
            COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi

          {
            echo "notes<<EOF"
            echo "## Changes"
            echo ""
            echo "$COMMITS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: false

  deploy-release:
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            bash /home/deploy/docker/campersite/deploy.sh
