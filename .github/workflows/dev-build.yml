name: Dev - Test, Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/test.yml"
      - ".github/workflows/lint.yml"
      - ".github/workflows/ntfy-on-pr.yml"
      - "docs/**"
      - "plans/**"
      - "README.md"
      - "LICENSE"
      - ".env.example"
      - ".gitignore"
      - ".dockerignore"
      - "renovate.json"
      - ".github/workflows/release-build.yml"


concurrency:
  group: campersite-dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Start server
      - name: Start server
        env:
          NODE_ENV: production
          ADMIN_USERNAME: test
          ADMIN_PASSWORD: testtesttest
          SESSION_SECRET: testqwertyuiopasdfghjklzxcvbnm123456test
        run: |
          node src/server/index.js &
      
      # Wait until server is reachable 
      - name: Wait for server
        run: |
          for i in {1..10}; do
            if curl -s http://127.0.0.1:3000 >/dev/null && curl -s http://127.0.0.1:3001 >/dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run admin smoketest
        env:
          TEST_PATH: /admin/login
          TEST_PORT: 3001
        run: node tests/smoke-http.js

      - name: Run public smoketest
        env:
          TEST_PATH: /
        run: node tests/smoke-http.js

      - name: Run robots.txt smoketest
        env:
          TEST_PATH: /robots.txt
        run: node tests/smoke-http.js
    
      - name: Run sitemap smoketest
        env:
          TEST_PATH: /sitemap.xml
        run: node tests/smoke-http.js
      
      - name: Run /contact smoketest
        env:
          TEST_PATH: /contact
        run: node tests/smoke-http.js

      - name: Run /caravans smoketest
        env:
          TEST_PATH: /caravans
        run: node tests/smoke-http.js

  build-dev:
    runs-on: ubuntu-latest
    needs: test-dev

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: git.darkzoul.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: git.darkzoul.org/dark_zoul/recomte
          tags: |
            type=raw,value=dev
            type=sha

      - name: Generate version.json
        run: |
          cat <<EOF > version.json
          {
            "version": "dev",
            "commit": "${{ github.sha }}",
            "env": "dev"
          }
          EOF

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=git.darkzoul.org/dark_zoul/recomte:dev-cache
          cache-to: type=registry,ref=git.darkzoul.org/dark_zoul/recomte:dev-cache,mode=max
          build-args: |
            APP_VERSION=dev
            APP_COMMIT=${{ github.sha }}

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-dev
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Trigger Webhook Deployment
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # Minimal payload - just needs to be signed
          PAYLOAD='{"trigger": "gitea-actions"}'
          
          # Calculate HMAC-SHA256 signature
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | cut -d' ' -f2)
          
          # Send webhook
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-Gitea-Signature: $SIGNATURE" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
          
          echo "✅ Deployment webhook triggered!"

      - name: Wait for Deployment to Complete
        run: |
          echo "⏳ Waiting for deployment to complete..."
          sleep 30
          
          # Check if app is healthy (adjust URL)
          for i in {1..20}; do
            if curl -s -f -o /dev/null "https://test.recomte.ru/healthcheck"; then
              echo "✅ App is healthy!"
              exit 0
            fi
            echo "⏳ Waiting for app... ($i/20)"
            sleep 3
          done
          
          echo "❌ App failed to become healthy"
          exit 1