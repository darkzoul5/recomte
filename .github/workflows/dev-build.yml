name: Dev - Test, Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/test.yml"
      - ".github/workflows/lint.yml"
      - ".github/workflows/ntfy-on-pr.yml"
      - ".github/workflows/release-build.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/security-report.yml"
      - "docs/**"
      - "plans/**"
      - "README.md"
      - "LICENSE"
      - ".env.example"
      - ".gitignore"
      - ".dockerignore"
      - "renovate.json"
      - "cliff.toml"


concurrency:
  group: campersite-dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-dev:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: git.darkzoul.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: git.darkzoul.org/dark_zoul/recomte
          tags: |
            type=raw,value=dev
            type=sha

      - name: Generate version.json
        run: |
          cat <<EOF > version.json
          {
            "version": "dev",
            "commit": "${{ github.sha }}",
            "env": "dev"
          }
          EOF

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=git.darkzoul.org/dark_zoul/recomte:dev-cache
          cache-to: type=registry,ref=git.darkzoul.org/dark_zoul/recomte:dev-cache,mode=max
          build-args: |
            APP_VERSION=dev
            APP_COMMIT=${{ github.sha }}

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-dev
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Trigger Webhook Deployment
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # Minimal payload - just needs to be signed
          PAYLOAD='{"trigger": "gitea-actions"}'
          
          # Calculate HMAC-SHA256 signature
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | cut -d' ' -f2)
          
          # Send webhook
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-Gitea-Signature: $SIGNATURE" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
          
          echo "✅ Deployment webhook triggered!"

      - name: Wait for Deployment to Complete
        run: |
          echo "⏳ Waiting for deployment to complete..."
          sleep 30
          
          # Check if app is healthy (adjust URL)
          for i in {1..20}; do
            if curl -s -f -o /dev/null "https://test.recomte.ru/healthcheck"; then
              echo "✅ App is healthy!"
              exit 0
            fi
            echo "⏳ Waiting for app... ($i/20)"
            sleep 3
          done
          
          echo "❌ App failed to become healthy"
          exit 1