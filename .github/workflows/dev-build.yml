name: Dev - Build and Deploy

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed 

concurrency:
  group: campersite-dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev:
    if: |
      github.event.workflow_run.conclusion == 'success' && (
      github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: git.darkzoul.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: git.darkzoul.org/dark_zoul/recomte
          tags: |
            type=raw,value=dev
            type=sha

      - name: Generate version.json
        run: |
          cat <<EOF > version.json
          {
            "version": "dev",
            "commit": "${{ github.sha }}",
            "env": "dev"
          }
          EOF

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=git.darkzoul.org/dark_zoul/recomte:buildcache
          cache-to: type=registry,ref=git.darkzoul.org/dark_zoul/recomte:buildcache,mode=max
          build-args: |
            APP_VERSION=dev
            APP_COMMIT=${{ github.sha }}

  deploy-dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    needs: build-dev

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            bash /home/deploy/docker/campersite/deploy.sh
            bash /home/deploy/docker/campersite/scripts/sync-prod-db-to-test.sh
