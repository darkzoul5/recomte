name: Security Scan

on:
  schedule:
    - cron: "0 3 * * 1"

  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/nodejs \
            --config=p/typescript \
            --json \
            --output semgrep.json

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v3
        with:
          name: semgrep-report
          path: semgrep.json


  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/gitleaks/gitleaks:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          gitleaks git \
            --source . \
            --report-format json \
            --report-path gitleaks.json

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v3
        with:
          name: gitleaks-report
          path: gitleaks.json


  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    container:
      image: aquasec/trivy:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --format json \
            --output trivy.json \
            .

      - name: Upload Trivy report
        uses: actions/upload-artifact@v3
        with:
          name: trivy-report
          path: trivy.json