name: Node Dependency Update Bot

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-deps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install -g npm-check-updates

      - name: Create or update branch
        run: |
          BRANCH="deps/node-dependency-updates"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          git fetch origin

          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git rebase origin/main || git reset --hard origin/main
          else
            git checkout -b "$BRANCH"
          fi

      - name: Check updates
        id: check
        run: |
          ncu --target minor --jsonUpgraded > upgrades.json

          if [ ! -s upgrades.json ] || [ "$(cat upgrades.json)" = "{}" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No dependency updates found."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Dependency updates found."
          fi

      - name: Apply dependency updates
        if: steps.check.outputs.has_updates == 'true'
        run: |
          ncu -u --target minor
          rm -f package-lock.json
          npm install

      - name: Commit updates
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git config user.name "gitea-actions-bot"
          git config user.email "gitea-actions-bot@local"

          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "has_commit=false" >> $GITHUB_ENV
            echo "No actual dependency changes to commit."
          else
            git commit -m "deps: Node dependency update"
            echo "has_commit=true" >> $GITHUB_ENV
          fi

      - name: Push branch
        if: steps.check.outputs.has_updates == 'true' && env.has_commit == 'true'
        run: |
          git push origin "$BRANCH" --force-with-lease

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true' && env.has_commit == 'true'
        env:
          TOKEN: ${{ secrets.REPO_W_TOKEN }}
        run: |
          EXISTING_PR=$(curl -s \
            -H "Authorization: token $TOKEN" \
            "https://git.darkzoul.org/api/v1/repos/dark_zoul/campersite/pulls?state=open" \
            | jq -r '.[] | select(.head.ref=="'"$BRANCH"'") | .number' | head -n1)

          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists: #$EXISTING_PR"
            exit 0
          fi

          curl -X POST "https://git.darkzoul.org/api/v1/repos/dark_zoul/campersite/pulls" \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"head\": \"${BRANCH}\",
              \"base\": \"main\",
              \"title\": \"deps: Node dependency updates\",
              \"body\": \"Node dependency update PR\"
            }"